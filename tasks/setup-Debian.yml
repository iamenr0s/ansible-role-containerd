---

- name: Ensure apt prerequisite packages are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-apt
    state: present
    update_cache: true
  tags: containerd

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: containerd

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_apt_gpg_key }}"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'
  tags: containerd

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/docker.asc] {{ docker_apt_repo_url }}
      {{ ansible_facts['distribution_release'] }} stable{{ ' nightly' if docker_apt_repo_enable_nightly | bool else '' }}
    filename: docker
    state: present
    update_cache: true
  tags: containerd
