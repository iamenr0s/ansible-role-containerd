---

# tasks file for ansible-role-containerd

- name: Include OS specific tasks
  ansible.builtin.include_tasks: setup-RedHat.yml
  when: ansible_facts['os_family'] == 'RedHat'
  tags: containerd

- name: Ensure containerd is installed
  ansible.builtin.package:
    name: "{{ containerd_package }}"
    state: "{{ containerd_package_state }}"
  tags: containerd

- name: Ensure containerd is started and enabled at boot
  ansible.builtin.service:
    name: containerd
    state: "{{ containerd_service_state }}"
    enabled: "{{ containerd_service_enabled }}"
  tags: containerd

- name: Ensure containerd config directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: containerd

- name: Get defaults from containerd
  ansible.builtin.command:
    cmd: containerd config default
  changed_when: false
  register: containerd_config_default
  when: containerd_config_default_write
  tags: containerd

- name: Prepare containerd config.toml from default config
  ansible.builtin.copy:
    dest: /tmp/containerd_config.toml
    content: "{{ containerd_config_default.stdout }}"
    mode: '0644'
  when: containerd_config_default_write
  changed_when: false
  tags: containerd

- name: Set cgroup driver to systemd
  ansible.builtin.lineinfile:
    insertafter: '.*\[plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options\]$'
    line: '          SystemdCgroup = true'
    state: present
    path: /tmp/containerd_config.toml
  when:
    - containerd_config_default_write
    - containerd_config_cgroup_driver_systemd
  changed_when: false
  tags: containerd

- name: Ensure SystemdCgroup = false is not set
  ansible.builtin.lineinfile:
    path: /tmp/containerd_config.toml
    state: absent
    line: '            SystemdCgroup = false'
  notify: Restart containerd
  when:
    - containerd_config_default_write
    - containerd_config_cgroup_driver_systemd
  changed_when: false
  tags: containerd

- name: Copy config.toml to /etc/containerd
  ansible.builtin.copy:
    remote_src: true
    src: /tmp/containerd_config.toml
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: '0644'
  notify: Restart containerd
  when: containerd_config_default_write
  tags: containerd

- name: Cleanup temporary file
  ansible.builtin.file:
    path: /tmp/containerd_config.toml
    state: absent
  changed_when: false
  tags: containerd

- name: Ensure containerd is restarted immediately if necessary
  ansible.builtin.meta: flush_handlers
  tags: containerd
